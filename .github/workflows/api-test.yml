name: API Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

env:
  APIADMIN_URL: ${{ secrets.APIADMIN_URL }}
  APIADMIN_TOKEN: ${{ secrets.APIADMIN_TOKEN }}
  TEST_COLLECTION_ID: ${{ secrets.TEST_COLLECTION_ID }}
  ENVIRONMENT: ${{ vars.ENVIRONMENT || 'production' }}

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Verify secrets
        run: |
          if [ -z "$APIADMIN_URL" ] || [ -z "$APIADMIN_TOKEN" ]; then
            echo "Skipping: APIADMIN_URL / APIADMIN_TOKEN secrets are not configured."
            exit 0
          fi

      - name: Checkout code
        if: ${{ env.APIADMIN_URL != '' }}
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ env.APIADMIN_URL != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ApiAdmin CLI
        if: ${{ env.APIADMIN_URL != '' }}
        run: |
          npm install -g @apiadmin/cli || echo "CLI not available, using curl"

      - name: Run API Tests
        if: ${{ env.APIADMIN_URL != '' }}
        id: run-tests
        run: |
          if command -v apiadmin &> /dev/null; then
            apiadmin test \
              --collection "$TEST_COLLECTION_ID" \
              --env "$ENVIRONMENT" \
              --output junit \
              --file test-results.xml
          else
            curl -fsS -X POST "$APIADMIN_URL/api/cicd/test/run" \
              -H "Authorization: Bearer $APIADMIN_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"collectionId\": \"$TEST_COLLECTION_ID\", \"environment\": \"$ENVIRONMENT\", \"format\": \"junit\"}" \
              -o test-results.xml
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: ${{ always() && env.APIADMIN_URL != '' }}
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30
