name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies for audit
        run: |
          SKIP_PREINSTALL=true npm ci || true
          (cd Server && PUPPETEER_SKIP_DOWNLOAD=true npm ci)
          (cd Client && npm ci)

      - name: Fail on critical npm advisories (Server)
        working-directory: Server
        run: npm audit --audit-level=critical

      - name: Report high advisories (non-blocking)
        run: |
          npm audit --audit-level=high || true
          (cd Client && npm audit --audit-level=high) || true
          (cd Server && npm audit --audit-level=high) || true
