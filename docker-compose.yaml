version: '3.8'

x-app-env: &app-env
  NODE_ENV: production
  PORT: "3000"
  APP_ROOT: /app
  MONGODB_URL: mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:?Set MONGO_PASSWORD}@mongodb:27017/apiadmin?authSource=admin
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a strong random value}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
  CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
  ALLOW_PUBLIC_REGISTRATION: ${ALLOW_PUBLIC_REGISTRATION:-false}
  ALLOW_PRIVATE_OUTBOUND: ${ALLOW_PRIVATE_OUTBOUND:-false}
  ALLOW_MOCK_SCRIPTS: ${ALLOW_MOCK_SCRIPTS:-false}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  apiadmin:
    build:
      context: .
      dockerfile: Dockerfile
      pull: false
    container_name: apiadmin
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      <<: *app-env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
    restart: unless-stopped
    networks:
      - apiadmin-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',function(r){process.exit(r.statusCode===200?0:1)}).on('error',function(){process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  mongodb:
    image: mongo:6.0
    container_name: apiadmin-mongodb
    # 生产默认不暴露到宿主机；需要本地调试时设置 MONGO_PUBLISH_PORT
    ports:
      - "${MONGO_PUBLISH_PORT:-127.0.0.1:27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:?Set MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=apiadmin
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - apiadmin-network

  redis:
    image: redis:7-alpine
    container_name: apiadmin-redis
    ports:
      - "${REDIS_PUBLISH_PORT:-127.0.0.1:6379}:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - apiadmin-network

  nginx:
    profiles: ["with-nginx"]
    image: nginx:alpine
    container_name: apiadmin-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      apiadmin:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - apiadmin-network

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local

networks:
  apiadmin-network:
    driver: bridge
