replicaCount: 2

image:
  repository: ghcr.io/hanyouqing/apiadmin
  pullPolicy: IfNotPresent
  tag: '0.1.0' # apiadmin-image-tag

imagePullSecrets: []

nameOverride: ''
fullnameOverride: ''

serviceAccount:
  create: true
  annotations: {}
  name: ''

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: 'nginx'
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
  hosts:
    - host: apiadmin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: apiadmin-tls
      hosts:
        - apiadmin.example.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: '7'
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    rootUsername: 'apiadmin'
    rootPassword: ''
    database: 'apiadmin'
  external:
    url: ''
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ''
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

redis:
  enabled: true
  image:
    repository: redis
    tag: '7-alpine'
    pullPolicy: IfNotPresent
  auth:
    enabled: true
    password: ''
  external:
    url: ''
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ''
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

env:
  NODE_ENV: production
  PORT: '3000'
  APP_ROOT: '/app'
  ALLOW_PUBLIC_REGISTRATION: 'false'
  ALLOW_PRIVATE_OUTBOUND: 'false'
  ALLOW_MOCK_SCRIPTS: 'false'
  ALLOW_UNSAFE_MOCK_SCRIPTS: 'false'
  SWAGGER_ENABLED: 'false'
  CORS_ORIGIN: 'https://apiadmin.example.com'
  REGULATED: 'false'
  ALLOW_CLOUD_AI: 'false'

config:
  # Empty values are generated into the release Secret. Set requireExplicitSecrets for production.
  requireExplicitSecrets: false
  existingSecret: ''
  jwtSecret: ''
  secretsEncryptionKey: ''
  jwtExpiresIn: '7d'
  uploadMaxSize: '10485760'

persistence:
  enabled: true
  storageClass: ''
  accessMode: ReadWriteOnce
  size: 10Gi
