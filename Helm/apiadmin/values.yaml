replicaCount: 2

image:
  repository: apiadmin/apiadmin
  pullPolicy: IfNotPresent
  # 生产请固定版本，禁止使用 latest
  tag: "0.0.1"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 1001

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1001

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: apiadmin.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: apiadmin-tls
      hosts:
        - apiadmin.example.com

resources:
  limits:
    cpu: 1000m
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

mongodb:
  enabled: true
  auth:
    enabled: true
    # 部署前必须通过 --set 或 values 覆盖
    rootUsername: "apiadmin"
    rootPassword: ""
    database: "apiadmin"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

redis:
  enabled: true
  auth:
    enabled: true
    # 部署前必须通过 --set 或 values 覆盖
    password: ""
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

env:
  NODE_ENV: production
  PORT: "3000"
  APP_ROOT: "/app"
  ALLOW_PUBLIC_REGISTRATION: "false"
  ALLOW_PRIVATE_OUTBOUND: "false"
  ALLOW_MOCK_SCRIPTS: "false"
  SWAGGER_ENABLED: "false"
  CORS_ORIGIN: "https://apiadmin.example.com"

config:
  # 部署前必须覆盖为 >=32 字符随机值
  jwtSecret: ""
  jwtExpiresIn: "7d"
  uploadMaxSize: "10485760"

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
