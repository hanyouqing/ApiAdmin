{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apiadmin.redis.host" . }}
  labels:
    {{- include "apiadmin.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: redis
  selector:
    {{- include "apiadmin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
{{- end }}
