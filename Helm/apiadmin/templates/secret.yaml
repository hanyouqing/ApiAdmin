{{- if or (not .Values.config.jwtSecret) (lt (len .Values.config.jwtSecret) 32) }}
{{- fail "config.jwtSecret must be set to a strong random value (>=32 characters)" }}
{{- end }}
{{- if not .Values.mongodb.auth.rootPassword }}
{{- fail "mongodb.auth.rootPassword must be set" }}
{{- end }}
{{- if not .Values.redis.auth.password }}
{{- fail "redis.auth.password must be set" }}
{{- end }}
{{- if or (not .Values.env.CORS_ORIGIN) (eq .Values.env.CORS_ORIGIN "*") }}
{{- fail "env.CORS_ORIGIN must be an explicit origin in production" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "apiadmin.fullname" . }}-secret
  labels:
    {{- include "apiadmin.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ .Values.config.jwtSecret | b64enc | quote }}
  mongodb-password: {{ .Values.mongodb.auth.rootPassword | b64enc | quote }}
  redis-password: {{ .Values.redis.auth.password | b64enc | quote }}
  mongodb-url: {{ printf "mongodb://%s:%s@%s-mongodb:27017/%s?authSource=admin" (.Values.mongodb.auth.rootUsername | default "apiadmin") .Values.mongodb.auth.rootPassword (include "apiadmin.fullname" .) .Values.mongodb.auth.database | b64enc | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis:6379" .Values.redis.auth.password (include "apiadmin.fullname" .) | b64enc | quote }}
