{{- if and .Values.config.requireExplicitSecrets (or (not .Values.config.jwtSecret) (lt (len .Values.config.jwtSecret) 32)) -}}
{{- fail "requireExplicitSecrets: config.jwtSecret must be at least 32 characters" -}}
{{- end -}}
{{- if and .Values.config.requireExplicitSecrets (or (not .Values.env.CORS_ORIGIN) (eq .Values.env.CORS_ORIGIN "*")) -}}
{{- fail "requireExplicitSecrets: env.CORS_ORIGIN must be set and must not be *" -}}
{{- end -}}
{{- if and .Values.config.requireExplicitSecrets .Values.mongodb.enabled (not .Values.mongodb.auth.rootPassword) -}}
{{- fail "requireExplicitSecrets: mongodb.auth.rootPassword is required when mongodb.enabled is true" -}}
{{- end -}}
{{- if and .Values.config.requireExplicitSecrets (not .Values.mongodb.enabled) (not .Values.mongodb.external.url) -}}
{{- fail "requireExplicitSecrets: mongodb.external.url is required when mongodb.enabled is false" -}}
{{- end -}}
{{- if and .Values.config.requireExplicitSecrets .Values.redis.enabled (not .Values.redis.auth.password) -}}
{{- fail "requireExplicitSecrets: redis.auth.password is required when redis.enabled is true" -}}
{{- end -}}
{{- if and .Values.config.requireExplicitSecrets (not .Values.redis.enabled) (not .Values.redis.external.url) -}}
{{- fail "requireExplicitSecrets: redis.external.url is required when redis.enabled is false" -}}
{{- end -}}
{{- if not .Values.config.existingSecret -}}
{{- $secretName := include "apiadmin.secretName" . -}}
{{- $jwt := include "apiadmin.secretValue" (list . .Values.config.jwtSecret $secretName "jwt-secret") -}}
{{- if lt (len $jwt) 32 -}}
{{- fail "config.jwtSecret must be at least 32 characters" -}}
{{- end -}}
{{- $mongoURL := .Values.mongodb.external.url -}}
{{- $mongoPass := "" -}}
{{- if .Values.mongodb.enabled -}}
{{- $mongoPass = include "apiadmin.secretValue" (list . .Values.mongodb.auth.rootPassword $secretName "mongodb-root-password") -}}
{{- $mongoURL = printf "mongodb://%s:%s@%s:27017/%s?authSource=admin" (.Values.mongodb.auth.rootUsername | urlquery) ($mongoPass | urlquery) (include "apiadmin.mongodb.host" .) .Values.mongodb.auth.database -}}
{{- end -}}
{{- if not $mongoURL -}}
{{- fail "mongodb.external.url is required when mongodb.enabled is false" -}}
{{- end -}}
{{- $redisURL := .Values.redis.external.url -}}
{{- $redisPass := "" -}}
{{- if .Values.redis.enabled -}}
{{- $redisPass = include "apiadmin.secretValue" (list . .Values.redis.auth.password $secretName "redis-password") -}}
{{- $redisURL = printf "redis://:%s@%s:6379" ($redisPass | urlquery) (include "apiadmin.redis.host" .) -}}
{{- end -}}
{{- if not $redisURL -}}
{{- fail "redis.external.url is required when redis.enabled is false" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "apiadmin.labels" . | nindent 4 }}
type: Opaque
data:
  jwt-secret: {{ $jwt | b64enc }}
  mongodb-url: {{ $mongoURL | b64enc }}
  redis-url: {{ $redisURL | b64enc }}
  {{- if .Values.mongodb.enabled }}
  mongodb-root-password: {{ $mongoPass | b64enc }}
  {{- end }}
  {{- if .Values.redis.enabled }}
  redis-password: {{ $redisPass | b64enc }}
  {{- end }}
  {{- if .Values.config.secretsEncryptionKey }}
  secrets-encryption-key: {{ .Values.config.secretsEncryptionKey | b64enc }}
  {{- end }}
{{- end }}
