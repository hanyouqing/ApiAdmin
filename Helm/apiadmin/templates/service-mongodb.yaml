{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apiadmin.mongodb.host" . }}
  labels:
    {{- include "apiadmin.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
spec:
  type: ClusterIP
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
  selector:
    {{- include "apiadmin.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongodb
{{- end }}
